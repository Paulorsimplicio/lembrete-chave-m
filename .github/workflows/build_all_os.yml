name: Compilar Executáveis (Windows, Mac e Linux)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build para ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: LembreteChaveM-Windows.exe
            output_file: dist/LembreteChaveM.exe
          - os: macos-latest
            artifact_name: LembreteChaveM-MacOS.zip
            output_file: dist/LembreteChaveM-MacOS.zip
          - os: ubuntu-latest
            artifact_name: LembreteChaveM-Linux
            output_file: dist/LembreteChaveM

    steps:
      - name: Baixar código-fonte
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gerar Ícones
        run: python generate_assets.py

      - name: Rodar Testes Unitários
        run: python -m unittest discover tests

      - name: Compilar Executável com PyInstaller
        run: python build_exe.py

      - name: Salvar Binário Compilado como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_file }}
